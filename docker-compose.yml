name: senior-project
services:
    db:
        image: postgres:alpine
        restart: always
        environment:
            POSTGRES_PASSWORD: example
        ports:
         - 5432:5432
        volumes:
            - db_data:/var/lib/postgresql/data
    adminer:
        image: adminer
        restart: always
        ports:
          - 8080:8080

volumes:
    db_data: